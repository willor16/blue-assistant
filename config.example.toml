# Configuracion del asistente de Wilmer

# --- Cerebro (modelo de lenguaje) -----------------------------------------
# Proveedor: groq | openrouter | mistral | gemini
provider = "groq"

# API key GRATIS de Groq: https://console.groq.com/keys
api_key = ""

# Groq free. gpt-oss-120b: MUCHO mejor llamando herramientas que llama-3.3-70b
# (crea/ejecuta protocolos sin inventar acciones). Alternativas en Groq:
#   llama-3.3-70b-versatile (anterior) | llama-3.1-8b-instant (más margen, menos lista)
model = "openai/gpt-oss-120b"

# OJO: los free tiers de Gemini son DIMINUTOS (flash-lite = 20 req/día real).
# Gemini de respaldo:
#   provider = "gemini"
#   api_key  = "TU_API_KEY_AQUI"
#   model    = "gemini-3.5-flash-lite"

# --- Voz -------------------------------------------------------------------
# Motor: kokoro (cálida, neural local, +500 MB RAM)
#      | edge   (Microsoft Neural, online, gratis, voces muy humanas)
#      | piper  (ligera, robótica)
tts = "kokoro"
# Voz Kokoro (español): ef_dora (femenina) | em_alex (masculina) | em_santa
kokoro_voice = "ef_dora"
# Voz Edge-TTS (solo si tts = "edge") — MX/CO/CL/PE/AR
#   es-MX-DaliaNeural | es-MX-JorgeNeural | es-MX-CecilioNeural | es-MX-RenataNeural
#   es-CO-SalomeNeural | es-CO-GonzaloNeural
#   es-CL-CatalinaNeural | es-CL-LorenzoNeural
#   es-PE-CamilaNeural | es-PE-AlexNeural
#   es-AR-ElenaNeural | es-AR-TomasNeural
edge_voice = "es-CL-CatalinaNeural"
# Voz piper (solo si tts = "piper"): es_MX-claude-high.onnx | es_ES-davefx-medium.onnx
voice = "es_MX-claude-high.onnx"

# Tamaño del modelo de oido: tiny | base | small | medium
whisper_size = "small"

assistant_name = "Blue"

# --- Tareas pesadas (Fase 2): delegadas a Claude Code (tu suscripción) ------
# Modelo para tareas: "sonnet" (el bueno, tarda más) o "haiku" (rápido/barato).
task_model = "sonnet"
# Carpeta donde Claude Code trabaja por defecto (proyectos, documentos).
task_workdir = "/home/wilmer"

# --- Correo (Fase 3): IMAP/SMTP con CONTRASEÑA DE APLICACIÓN -----------------
# 1) Activa verificación en 2 pasos en tu Google.
# 2) Crea una "Contraseña de aplicación" en https://myaccount.google.com/apppasswords
# 3) Pégala aquí (16 letras). NO es tu contraseña normal de Gmail.
email_address = ""
email_app_password = ""
imap_host = "imap.gmail.com"
smtp_host = "smtp.gmail.com"

# --- El escalafón de motores -----------------------------------------------
# PROMETEO (la voz, el proveedor de arriba) · ORFEO (jarvis-heavy en Ollama)
# ARGOS (reservado) · ÍCARO (Hermes Agent) · ÉREBO (Claude Code)
# Dónde vive el Ollama del que salen ORFEO e ÍCARO.
# PONLO POR NOMBRE, NO POR IP: el DHCP del router cambia la dirección cuando le
# apetece, y entonces Blue da el servidor por apagado y se va a la nube sin
# decírtelo. El nombre mDNS (.local) sobrevive a eso.
# Desde OTRA RED (por VPN) subelo: el socket de 0,35 s es un deadline duro y un
# connect remoto lo pasa de sobra, con lo que BLUE daria el servidor por apagado
# y se iria a la nube sin decir nada. Y usa un nombre que resuelva fuera de la
# LAN: un .local por mDNS solo existe dentro de tu red.
# ollama_plazo_s = 3.0

ollama_host = "http://mi-servidor.local:11434"

# === Cadena de FAILOVER del cerebro =========================================
# Blue prueba estos EN ORDEN y, si uno falla, cae solo al siguiente. Cuánto se
# aparta el que falló depende de POR QUÉ falló: si el proveedor dice "reintenta
# en X s" se le hace caso; 180 s si es un fallo de red; 1.800 s si se agotó el
# cupo del día; ~60 s si es el tope por minuto (que se rellena enseguida).
#
# PRIMERO EL DE CASA. Sin cupo, sin tope por minuto y privado. Se le pregunta
# con un socket de 0,35 s antes de cada turno: si la máquina está apagada se
# descarta al instante y se va a la nube, y en cuanto la enciendes vuelve solo.
[[brain]]
provider = "ollama"
model = "jarvis"
# keep_alive ya NO se manda en la peticion: quien decide cuanto se queda el
# modelo en memoria es el servidor (OLLAMA_KEEP_ALIVE). Mandarlo desde aqui
# pisaba esa politica y le impedia liberar la RAM cuando hacia falta.
# El Modelfile suele fijar num_ctx en 8.192 y eso se queda CORTO: el prompt de
# Blue con todas las herramientas son ~9.600 tokens, así que desborda, y Ollama
# al desbordar trunca por el principio — se lleva el prompt del sistema y Blue
# se queda sin saber quién es, sin dar ningún error.
num_ctx = 32768

# La nube, de respaldo para cuando la máquina de casa esté apagada. Groq limita
# por MINUTO y POR MODELO (8.000 tokens), y una llamada de Blue son ~6.400: un
# turno con herramienta no cabe en un solo modelo. Por eso van varios apilados,
# cada uno con su propio cupo.
[[brain]]
provider = "groq"
model = "openai/gpt-oss-120b"
api_key = ""

[[brain]]
provider = "groq"
model = "openai/gpt-oss-20b"
api_key = ""

[[brain]]
provider = "groq"
model = "qwen/qwen3.8-27b"
api_key = ""

[[brain]]
provider = "gemini"
model = "gemini-3.5-flash-lite"
api_key = ""

[[brain]]
provider = "claude-cli"
model = "claude-haiku-4-5"

